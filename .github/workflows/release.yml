name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Check tag matches VERSION
        run: |
          test "v$(tr -d '[:space:]' < VERSION)" = "${GITHUB_REF_NAME}" \
            || { echo "VERSION 与 tag 不一致：$(cat VERSION) vs ${GITHUB_REF_NAME}"; exit 1; }

      - name: Build linux-x64 scraper
        run: |
          dotnet publish src/BatoceraMovieScraper/BatoceraMovieScraper.csproj \
            -c Release -r linux-x64 --self-contained true \
            -p:PublishSingleFile=true -p:DebugType=none \
            -o dist/linux-x64
          install -m 0755 dist/linux-x64/batoscrape deploy/payload/system/movies/batoscrape

      - name: Package (whitelist + key scan)
        run: python3 tools/make_release.py

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-release/moviescraper.tar.gz
            dist-release/moviescraper.version
            dist-release/sha256sums.txt
